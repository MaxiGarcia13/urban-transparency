name: 🏙️ Scrape ADRH País Vasco

on:
  schedule:
    # 1st of Jan/Apr/Jul/Oct at 07:30 UTC (every 3 months).
    - cron: '30 7 1 1,4,7,10 *'
  workflow_dispatch:

concurrency:
  group: scrape-adrh-pais-vasco
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    name: Scrape ADRH País Vasco
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install

      - name: Write .env
        run: |
          cat > .env <<EOF
          TURSO_URL=${{ secrets.TURSO_URL }}
          TURSO_AUTH_TOKEN=${{ secrets.TURSO_AUTH_TOKEN }}
          EOF

      - name: Scrape ADRH País Vasco
        run: pnpm scrape:adrh:pais-vasco
