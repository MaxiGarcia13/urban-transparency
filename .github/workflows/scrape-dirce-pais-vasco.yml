name: 🏙️ Scrape DIRCE País Vasco

on:
  schedule:
    # 1st of Jan/Apr/Jul/Oct at 08:00 UTC (every 3 months).
    - cron: '0 8 1 1,4,7,10 *'
  workflow_dispatch:

concurrency:
  group: scrape-dirce-pais-vasco
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    name: Scrape DIRCE País Vasco
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install

      - name: Write .env
        run: |
          cat > .env <<EOF
          TURSO_URL=${{ secrets.TURSO_URL }}
          TURSO_AUTH_TOKEN=${{ secrets.TURSO_AUTH_TOKEN }}
          EOF

      - name: Scrape DIRCE País Vasco
        run: pnpm scrape:dirce:pais-vasco
