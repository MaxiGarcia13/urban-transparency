name: 💸 Scrape PLACSP Asturias

on:
  schedule:
    # 2nd and 16th at 09:00 UTC (~every 15 days; after Cantabria/País Vasco on the 16th).
    - cron: '0 9 2,16 * *'
  workflow_dispatch:

concurrency:
  group: scrape-placsp-asturias
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    name: Scrape PLACSP Asturias
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install

      - name: Write .env
        run: |
          cat > .env <<EOF
          TURSO_URL=${{ secrets.TURSO_URL }}
          TURSO_AUTH_TOKEN=${{ secrets.TURSO_AUTH_TOKEN }}
          EOF

      - name: Scrape PLACSP Asturias
        run: pnpm scrape:placsp:asturias
